<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akun - Rexmarket</title>

    <link rel="stylesheet" href="Akun.css">

</head>

<body>

    <!-- Isi halaman akun di sini -->

    <script src="Akun.js"></script>

<!-- =========================================
LOGIN BOX
========================================= -->

<div class="login-box">

    <h2>Login</h2>

    <input
        type="text"
        placeholder="Masukkan Username">

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Masukkan Password">

        <span
            class="toggle-password"
            id="togglePassword">

            <svg
                id="eyeIcon"
                viewBox="0 0 24 24">

                <path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>

            </svg>

        </span>

    </div>

    <button class="login-btn">

        Login

    </button>

    <p class="register-text">

        Belum punya akun?

    </p>

    <a
        href="#"
        class="register-link">

        Register

    </a>

</div>
    
</body>

</html>
