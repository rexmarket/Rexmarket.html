<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akun - Rexmarket</title>

    <link rel="stylesheet" href="Akun.css">

</head>

<body>

    <!-- Isi halaman akun di sini -->

    <script type="module" src="Akun.js"></script>
    
    <!-- =========================================
TOP NOTIFICATION
========================================= -->

<div class="top-notification" id="topNotification">

    <svg viewBox="0 0 24 24">
        <path d="M20 6L9 17l-5-5"/>
    </svg>

    <div>

        <h4 id="notifTitle">Berhasil</h4>

        <p id="notifText">Pesan</p>

    </div>

</div>

<!-- =========================================
LOGIN BOX
========================================= -->
<div class="login-box">

    <h2 id="formTitle">Login</h2>

    <!-- =========================================
    USERNAME
    ========================================= -->

    <div class="username-box">

        <input
            type="text"
            id="username"
            placeholder="Masukkan Username"
            autocomplete="off">

        <div
            id="usernameSuggestion"
            class="username-suggestion">
        </div>

    </div>


    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Masukkan Password">

        <span class="toggle-password" id="togglePassword">

            <svg id="eyeIcon" viewBox="0 0 24 24"></svg>

        </span>

    </div>

    <!-- =========================================
PASSWORD ACTION
========================================= -->

<div class="password-action">

    <a href="#" id="forgotPassword">
        Lupa Password?
    </a>

    <a href="#" id="changePassword">
        Ganti Password
    </a>

</div>

    <button class="login-btn" id="mainBtn">
        Login
    </button>

    <p class="register-text" id="registerText">
        Belum punya akun?
    </p>

    <button class="register-btn" id="registerBtn">
        Register
    </button>

</div>
</div>

<!-- =========================================
RESET PASSWORD OVERLAY
========================================= -->

<div class="reset-overlay" id="resetOverlay">

    <div class="reset-box">

        <h2>Reset Password</h2>

        <input
            type="text"
            id="resetUsername"
            placeholder="Masukkan Username">

        <button
            class="login-btn"
            id="checkUsernameBtn">

            Cek Akun

        </button>

        <div id="newPasswordSection" style="display:none;">

            <div class="password-box">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Masukkan Password Baru">

            </div>

            <div class="password-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Konfirmasi Password Baru">

            </div>

            <button
                class="login-btn"
                id="confirmResetBtn">

                Konfirmasi

            </button>

        </div>

        <button
            class="register-btn"
            id="closeReset">

            Batal

        </button>

    </div>

</div>
    

<!-- =========================================
BACK BUTTON
========================================= -->
<button class="back-btn" id="backBtn" onclick="window.location.href='../Rexmarket.html'">

    <svg viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6"/>
    </svg>

</button>

    
</body>

</html>
