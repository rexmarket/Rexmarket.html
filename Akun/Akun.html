<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akun - Rexmarket</title>

    <link rel="stylesheet" href="Akun.css">

</head>

<body>

    <!-- Isi halaman akun di sini -->

    <script src="Akun.js"></script>

<!-- =========================================
LOGIN BOX
========================================= -->
<div class="login-box">

    <h2 id="formTitle">Login</h2>

    <input
        type="text"
        id="username"
        placeholder="Masukkan Username">

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Masukkan Password">

        <span class="toggle-password" id="togglePassword">

            <svg id="eyeIcon" viewBox="0 0 24 24"></svg>

        </span>

    </div>

    <button class="login-btn" id="mainBtn">
        Login
    </button>

    <p class="register-text" id="registerText">
        Belum punya akun?
    </p>

    <button class="register-btn" id="registerBtn">
        Register
    </button>

</div>
    
</body>

</html>
