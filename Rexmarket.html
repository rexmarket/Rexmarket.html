<style>

    /* =========================================
HEADER
========================================= */

body{

    margin:0;

    padding-top:50px;

}

#header{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:75px;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:rgba(8,20,45,.95);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 10px 30px rgba(0,0,0,.45);

    transition:.35s;

    z-index:99999;

}

/* Grid */

#header::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:

        linear-gradient(
            rgba(255,255,255,.05) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.05) 1px,
            transparent 1px
        );

    background-size:22px 22px;

    opacity:.35;

    animation:gridMove 8s linear infinite;

}

/* Scan */

#header::after{

    content:"";

    position:absolute;

    top:-100%;

    left:0;

    width:100%;
    height:100%;

    background:linear-gradient(

        transparent,

        rgba(255,255,255,.08),

        transparent

    );

    animation:scan 4s linear infinite;

}

/* Logo */

.header-logo{

    position:relative;

    width:450px;

    height:auto;

    display:block;

    object-fit:contain;

    z-index:2;

    pointer-events:none;

    user-select:none;

    filter:

        drop-shadow(0 0 8px rgba(255,255,255,.25))

        drop-shadow(0 0 18px rgba(30,144,255,.35));

}

/* Saat scroll */

#header.scrolled{

    background:rgba(125,10,20,.96);

    border-bottom:1px solid rgba(255,70,70,.20);

    box-shadow:

        0 10px 30px rgba(255,0,0,.25);

}

/* Animasi */

@keyframes gridMove{

    from{

        background-position:0 0;

    }

    to{

        background-position:22px 22px;

    }

}

@keyframes scan{

    from{

        top:-100%;

    }

    to{

        top:100%;

    }

}


    
    
    
    /* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

/* =========================================
BACKGROUND
========================================= */
body{
    margin:0;
    padding-top:75px; /* sama dengan tinggi header */

    font-family:'Poppins',sans-serif;

    color:#fff;

    overflow-x:hidden;

    min-height:100vh;

    position:relative;

    background:linear-gradient(
        180deg,
        #0A1B36 0%,
        #07162B 20%,
        #05101F 40%,
        #1A0B17 65%,
        #3A0C16 82%,
        #541018 100%
    );
}


/* =========================================
GRID
========================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    z-index:-2;

    pointer-events:none;

    background-image:

        linear-gradient(
            rgba(255,255,255,.04) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.04) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    animation:gridMove 12s linear infinite;

    opacity:.25;

}

/* =========================================
GLOW
========================================= */

body::after{

    content:"";

    position:fixed;

    inset:0;

    z-index:-1;

    pointer-events:none;

    background:

        radial-gradient(circle at 15% 10%,rgba(40,90,180,.15),transparent 30%),

        radial-gradient(circle at 80% 25%,rgba(25,60,130,.12),transparent 35%),

        radial-gradient(circle at 50% 75%,rgba(150,25,35,.10),transparent 40%),

        radial-gradient(circle at 20% 100%,rgba(110,15,25,.14),transparent 35%);

    animation:glowMove 10s ease-in-out infinite alternate;

}

/* =========================================
ANIMATION
========================================= */

@keyframes gridMove{

    from{

        background-position:0 0;

    }

    to{

        background-position:40px 40px;

    }

}

@keyframes glowMove{

    from{

        transform:translateY(0) scale(1);

    }

    to{

        transform:translateY(-30px) scale(1.08);

    }

    }




/* =========================================
   GLOW
========================================= */

body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(circle at 15% 10%,rgba(0,180,255,.25),transparent 28%),

        radial-gradient(circle at 85% 25%,rgba(40,120,255,.18),transparent 30%),

        radial-gradient(circle at 50% 75%,rgba(255,0,0,.12),transparent 35%),

        radial-gradient(circle at 20% 95%,rgba(255,60,60,.15),transparent 30%);

    animation:glowMove 10s ease-in-out infinite alternate;

    z-index:-1;

}

/* =========================================
   ANIMASI
========================================= */

@keyframes gridMove{

    from{

        background-position:0 0;

    }

    to{

        background-position:40px 40px;

    }

}

@keyframes glowMove{

    from{

        transform:translateY(0) scale(1);

    }

    to{

        transform:translateY(-30px) scale(1.08);

    }

}


/* =========================================
BOTTOM NAV
========================================= */
.bottom-nav{
    position:fixed;

    left:16px;
    right:16px;
    bottom:16px;

    height:72px;

    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    padding:0 18px 10px;

    overflow:visible;

    border-radius:22px;

    background:rgba(8,20,42,.95);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 8px 25px rgba(0,0,0,.45);

    z-index:9999;
}

/* Cahaya */
.bottom-nav::before{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    bottom:-14px;
    height:36px;
    border-radius:50%;
    background:rgba(0,140,255,.45);
    filter:blur(30px);
    z-index:-2;
}

/* Grid */
.bottom-nav::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);

    background-size:22px 22px;
    animation:bottomGrid 8s linear infinite;
    opacity:.35;

    z-index:-1;
}

/* =========================================
MENU ITEM
========================================= */

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;

    gap:4px;
    width:60px;

    color:#999;
    font-size:12px;

    cursor:pointer;
    transition:.25s;

    position:relative;
    z-index:2;
}

.nav-icon{
    width:22px;
    height:22px;

    fill:none;
    stroke:#999;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;

    transition:.25s;
}

.nav-item span{
    color:#999;
    font-weight:500;
    transition:.25s;
}

.nav-item.active .nav-icon{
    stroke:#ff4040;
}

.nav-item.active span{
    color:#ff4040;
    font-weight:600;
}

/* =========================================
CENTER BUTTON
========================================= */

.center-btn{
    position:fixed;
    left:50%;
    bottom:52px;
    transform:translateX(-50%);

    width:68px;
    height:68px;

    border:none;
    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(180deg,#2F78E7,#174EA6);

    cursor:pointer;

    z-index:10001;

    box-shadow:
        0 0 20px rgba(47,120,231,.45),
        0 8px 25px rgba(0,0,0,.45);

    transition:transform .2s;
}

/* Animasi pas ditekan */
.center-btn:active{
    transform:translateX(-50%) scale(.92);
}

/* 9 titik */
.center-btn i{
    display:grid;
    grid-template-columns:repeat(3,6px);
    grid-template-rows:repeat(3,6px);
    gap:6px;

    transform:none;
    margin-left:2px;   /* geser sedikit biar benar-benar center */
    margin-top:1px;
}

.center-btn i span{
    width:6px;
    height:6px;
    background:#fff;
    border-radius:50%;
}

NAV ACTIVE

/* =========================================
ICON

.menu-icon{

/* =========================================
ANIMATION

@keyframes bottomGrid{

    }

}

/* Hilangkan highlight biru saat disentuh */
*{
    -webkit-tap-highlight-color: transparent;
}

/* Hilangkan outline saat fokus */
button,
.nav-item,
.center-btn,
a{
    -webkit-tap-highlight-color: transparent;
    outline: none;
}

button:focus,
button:active,
.nav-item:focus,
.center-btn:focus,
a:focus{
    outline: none;
}


/* =========================================
BANNER
========================================= */

.banner-slider{
    width:100%;
    height:140px;
    margin:0;
    border-radius:0;
    overflow:hidden;
    position:relative;
}

.banner-track{
    display:flex;
    width:300%;
    height:100%;
    transition:transform .5s ease;
}

.banner{
    width:100%;
    height:140px;
    flex-shrink:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:#fff;

    background:linear-gradient(135deg,#0D47A1,#1976D2);
}

.banner h2{
    font-size:22px;
    font-weight:700;
    margin-bottom:4px;
}

.banner p{
    font-size:13px;
    opacity:.9;
}

.banner-dots{
    position:absolute;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
}

.banner-dots span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    transition:.3s;
}

.banner-dots .active{
    background:#fff;
    width:20px;
    border-radius:20px;
}

/* =========================================
SEARCH BAR
========================================= */
.search-box{
    width:92%;
    height:52px;
    margin:16px auto 20px;

    display:flex;
    align-items:center;

    padding:0 16px;

    border-radius:16px;

    background:rgba(12,35,70,.8);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.search-icon{
    width:20px;
    height:20px;

    stroke:#6faeff;
    stroke-width:2;

    fill:none;
}

.search-box input{
    flex:1;

    margin-left:12px;

    background:transparent;

    border:none;

    outline:none;

    color:#fff;

    font-size:14px;

    font-family:Poppins,sans-serif;
}

.search-box input::placeholder{
    color:#8ea8c9;
}


    /* =========================================
CATEGORY NAV
========================================= */
.category-nav{

    display:flex;

    gap:12px;

    overflow-x:auto;

    padding:0 16px 18px;

    scroll-behavior:smooth;

    scrollbar-width:none;

}

.category-nav::-webkit-scrollbar{

    display:none;

}

.category-item{

    flex:none;

    height:42px;

    padding:0 18px;

    border:none;

    border-radius:14px;

    background:rgba(255,255,255,.06);

    color:#b8c7df;

    font-size:14px;

    font-weight:600;

    white-space:nowrap;

    cursor:pointer;

    transition:.25s;

}

.category-item.active{

    background:#1976D2;

    color:#fff;

    box-shadow:0 0 15px rgba(25,118,210,.35);

}

.category-item:active{

    transform:scale(.96);

    }


    
/* =========================================
MENU PANEL OVERLAY
========================================= */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
    opacity:0;
    visibility:hidden;
    transition:.25s;
    z-index:99998;
}

.overlay.show{
    opacity:1;
    visibility:visible;
}

/* =========================================
MENU PANEL
========================================= */

.menu-panel{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%) scale(.95);

    width:90%;
    max-width:430px;

    height:70vh;

    background:#08142A;

    border-radius:24px;

    border:1px solid rgba(255,255,255,.08);

    padding:20px;

    box-sizing:border-box;

    opacity:0;
    visibility:hidden;

    overflow-y:auto;
    overflow-x:hidden;

    transition:.25s;

    z-index:99999;

}

.menu-panel.show{

    opacity:1;

    visibility:visible;

    transform:translate(-50%,-50%) scale(1);

}

.menu-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:16px;

    margin-top:20px;

    padding-bottom:20px;

}

.menu-card{

    height:145px;

    background:#112341;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.08);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    transition:.2s;

}

.menu-card:active{

    transform:scale(.96);

}

.menu-icon{

    width:42px;

    height:42px;

    fill:none;

    stroke:#3D8BFF;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;

    margin-bottom:12px;

}

.menu-card span{

    color:#fff;

    font-size:15px;

    font-weight:600;

    text-align:center;

}

    
</style>

<script>

/* =========================================
   JAVASCRIPT
========================================= */
/* =========================================
HEADER
========================================= */

window.addEventListener("scroll",function(){

    const header=document.getElementById("header");

    if(window.scrollY>650){

        header.classList.add("scrolled");

    }else{

        header.classList.remove("scrolled");

    }

});

/* =========================================
NAVBAR ACTIVE
========================================= */

document.addEventListener("DOMContentLoaded", () => {
    const navItems = document.querySelectorAll(".nav-item");

    navItems.forEach((item) => {
        item.addEventListener("click", function () {
            navItems.forEach(i => i.classList.remove("active"));
            this.classList.add("active");
        });
    });
});

    /* =========================================
BANNER AUTO SLIDE
========================================= */

const track = document.querySelector(".banner-track");

const dots = document.querySelectorAll(".banner-dots span");

let index = 0;

function slideBanner(){

    index++;

    if(index > 2){

        index = 0;

    }

    track.style.transform = `translateX(-${index * 33.333}%)`;

    dots.forEach(dot => dot.classList.remove("active"));

    dots[index].classList.add("active");

}

setInterval(slideBanner,4000);


    /* =========================================
CATEGORY NAV
========================================= */
const categoryItems =
document.querySelectorAll(".category-item");

categoryItems.forEach(item=>{

    item.onclick=()=>{

        categoryItems.forEach(i=>
            i.classList.remove("active")
        );

        item.classList.add("active");

    };

});



    /* =========================================
MENU PANEL
========================================= */

const centerBtn = document.querySelector(".center-btn");

const overlay = document.getElementById("overlay");

const menuPanel = document.getElementById("menuPanel");

centerBtn.onclick = () => {

    overlay.classList.add("show");

    menuPanel.classList.add("show");

};

overlay.onclick = () => {

    overlay.classList.remove("show");

    menuPanel.classList.remove("show");

};
